<!DOCTYPE html>
<html lang="en" data-scene="railway">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yaadon Ka Radio — 90s/2000s India, on loop</title>
<meta name="description" content="A tribute to the ambient music of everyday Indian spaces: trains, paan shops, chai stalls, dhabas and more.">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Press+Start+2P&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================
   BASE / RESET
   ============================ */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Poppins',system-ui,sans-serif;
  color:#f3ead9;
  background:#2b241d;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
img{display:block;max-width:100%;}
.font-display{font-family:'Baloo 2',system-ui,sans-serif;}
.font-pixel{font-family:'Press Start 2P',monospace;}

/* ============================
   PER-SCENE THEME VARIABLES
   ============================ */
html[data-scene="saloon"]     { --accent:#e0b84a; --glow:#8a5a2a; }
html[data-scene="paan"]       { --accent:#d9a441; --glow:#6fae6f; }
html[data-scene="railway"]    { --accent:#c9a97a; --glow:#8fb3c4; }
html[data-scene="chai"]       { --accent:#f2d9a8; --glow:#e0913a; }
html[data-scene="dhaba"]      { --accent:#ff8c42; --glow:#ff6a1f; }
html[data-scene="laundry"]    { --accent:#e8d4b0; --glow:#c9b896; }
html[data-scene="truck-driver"]{ --accent:#f2e2b8; --glow:#3fa3a3; }
html[data-scene="tailor"]     { --accent:#d9c08a; --glow:#a35b5b; }
html[data-scene="cassette-shop"]{ --accent:#e0a13a; --glow:#c4453f; }

/* ============================
   TAB BAR (hideable — see SCENES script section for auto-hide logic)
   ============================ */
.tabbar{
  position:fixed; top:58px; left:0; right:0; z-index:19;
  display:flex; gap:4px; overflow-x:auto;
  padding:8px 16px;
  background:rgba(20,16,12,.5);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:opacity .35s ease, transform .35s ease;
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{display:none;}
.tabbar.tabbar-hidden{ opacity:0; transform:translateY(-16px); pointer-events:none; }
.tab-btn{
  flex:0 0 auto;
  padding:8px 14px;
  font-size:.85rem;
  letter-spacing:.02em;
  color:#cbbfa9;
  border-bottom:3px solid transparent;
  white-space:nowrap;
  transition:color .25s, border-color .25s, text-shadow .25s;
}
.tab-btn small{display:block;font-size:.65rem;opacity:.7;font-weight:400;}
.tab-btn.active{
  color:#fff;
  border-color:var(--accent);
  text-shadow:0 0 10px var(--glow);
}

/* ============================
   TOP OVERLAY (clock, online counter, external links, tab toggle)
   always visible — independent of tab-bar hide state
   ============================ */
.top-left, .top-center, .top-right{
  position:fixed; top:18px; z-index:22;
  display:flex; align-items:center; gap:8px;
  font-size:.82rem; color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
}
.top-left{ left:20px; font-weight:500; }
.top-center{ left:50%; transform:translateX(-50%); }
.top-right{ right:16px; flex-wrap:wrap; justify-content:flex-end; max-width:70vw; }

.pulse-dot{
  width:8px; height:8px; border-radius:50%; flex:0 0 auto;
  background:#3ddc73; box-shadow:0 0 6px 2px rgba(61,220,115,.7);
  animation:dotPulse 1.6s ease-in-out infinite;
}
@keyframes dotPulse{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(1.3);} }

.icon-btn{
  width:30px; height:30px; border-radius:50%; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  color:#fff; font-size:.8rem;
  transition:background .2s;
}
.icon-btn:hover{ background:rgba(255,255,255,.22); }

.pill-link{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:999px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  color:#fff; font-size:.75rem; text-decoration:none;
  white-space:nowrap;
  transition:background .2s;
}
.pill-link:hover{ background:rgba(255,255,255,.22); }
.pill-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.ext-arrow{ opacity:.7; font-size:.7rem; }

@media (max-width:640px){
  .tabbar{ top:88px; }
  .top-left, .top-center, .top-right{ font-size:.72rem; }
  .top-left, .top-right{ top:12px; }
  .top-left{ left:12px; }
  .top-right{ right:8px; gap:6px; max-width:60vw; }
  /* stacked below the clock/links row so it never collides with them on narrow screens */
  .top-center{ top:52px; }
  .pill-link{ padding:5px 9px; font-size:.68rem; }
  .icon-btn{ width:26px; height:26px; font-size:.72rem; }
}

/* ============================
   SCENES (background stage)
   ============================ */
.scenes{ position:relative; width:100%; height:100vh; overflow:hidden; }
.scene{
  position:absolute; inset:0;
  opacity:0; pointer-events:none;
  transition:opacity 1.1s ease;
  overflow:hidden;
}
.scene.active{ opacity:1; pointer-events:auto; z-index:1; }
.scene-bg{ position:absolute; inset:0; }
.scene-shapes, .scene-overlays{ position:absolute; inset:0; }
.scene-caption{
  position:absolute; left:20px; bottom:110px;
  font-size:.75rem; color:rgba(255,255,255,.55);
  max-width:260px; line-height:1.4;
}

/* ---- shared ambient primitives ---- */
.bulb{
  position:absolute; width:10px; height:10px; border-radius:50%;
  background:radial-gradient(circle, #fff5d0, #f2c14e 70%);
  box-shadow:0 0 8px 2px rgba(242,193,78,.7);
  animation:twinkle 2.6s ease-in-out infinite;
}
.wisp{
  position:absolute; width:16px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.55);
  filter:blur(3px);
  animation:steamRise 4.5s ease-in infinite;
}
.mote{
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:rgba(255,255,255,.7);
  animation:floatMote 6s linear infinite;
}
.glow{ animation:glowPulse 2.8s ease-in-out infinite; }
.flicker{ animation:flicker 5s linear infinite; }

@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.2);}}
@keyframes steamRise{0%{opacity:0;transform:translate(0,0) scale(.7);}15%{opacity:.55;}80%{opacity:.25;}100%{opacity:0;transform:translate(-6px,-80px) scale(1.5);}}
@keyframes floatMote{0%{transform:translate(0,0);opacity:0;}10%{opacity:.7;}90%{opacity:.35;}100%{transform:translate(14px,-100px);opacity:0;}}
@keyframes glowPulse{0%,100%{opacity:.55;filter:blur(2px);}50%{opacity:1;filter:blur(6px);}}
@keyframes flicker{0%,19%,21%,23%,54%,56%,100%{opacity:1;}20%,22%,55%{opacity:.3;}}
@keyframes sunDrift{0%,100%{opacity:.16;}50%{opacity:.38;}}

/* ---- photo scenes (image only, no shapes/SVG) — shared dark gradient for control legibility ---- */
.photo-overlay{
  position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.5));
}
[data-scene-id="saloon"] .scene-bg{
  background-image:url('images/saloon.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 1. PAAN SHOP (photo scene) ---- */
[data-scene-id="paan"] .scene-bg{
  background-image:url('images/paan-shop.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 2. RAILWAY (photo scene) ---- */
[data-scene-id="railway"] .scene-bg{
  background-image:url('images/railway.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 3. CHAI SHOP (photo scene) ---- */
[data-scene-id="chai"] .scene-bg{
  background-image:url('images/chai-shop.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 4. DHABA (photo scene) ---- */
[data-scene-id="dhaba"] .scene-bg{
  background-image:url('images/dhaba.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 5. LAUNDRY (photo scene) ---- */
[data-scene-id="laundry"] .scene-bg{
  background-image:url('images/laundry.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 6. TRUCK DRIVER (photo scene) ---- */
[data-scene-id="truck-driver"] .scene-bg{
  background-image:url('images/truck-driver.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 7. TAILOR (photo scene) ---- */
[data-scene-id="tailor"] .scene-bg{
  background-image:url('images/tailor.jpg');
  background-size:cover;
  background-position:center;
}

/* ---- 8. CASSETTE SHOP (photo scene) ----
   cover, like every other scene — full-bleed coverage wins over cropping the edge posters.
   position biased to 30% vertical (not 50%) so any top/bottom crop on ultra-wide viewports
   eats into the dog/rickshaw at the bottom before it eats into the SA RE GA MA signage. */
[data-scene-id="cassette-shop"] .scene-bg{
  background-image:url('images/cassette-shop.jpg');
  background-size:cover;
  background-position:center 30%;
}

/* ============================
   ADD-YOUR-PLAYLIST PANEL
   ============================ */
.add-panel{
  position:fixed; right:12px; bottom:24px; z-index:15;
  width:290px; max-width:calc(100vw - 24px);
  background:rgba(20,16,12,.92);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
/* the player is horizontally centered and can reach ~430px wide (pill skin) or ~380px
   (radio skin), which overlaps this panel's default bottom-right slot on medium
   viewports — climb above it there */
@media (max-width:1080px){
  .add-panel{ bottom:130px; }
}
.add-toggle{ width:100%; text-align:left; padding:12px 14px; font-weight:600; font-size:.85rem; }
.add-body{ padding:0 14px 14px; display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto; }
.add-panel.collapsed .add-body{ display:none; }
.add-body input{
  padding:9px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06); color:#f3ead9; font-size:.82rem;
}
.add-body input::placeholder{ color:#a99a82; }
.add-body button#addSubmit{
  padding:9px 10px; border-radius:8px; background:var(--accent); color:#241a10; font-weight:600; font-size:.82rem;
}
.add-error{ font-size:.72rem; color:#ff9d8a; min-height:1em; }
.add-error.success{ color:#8fd9a0; }
.spotify-picks{ margin-top:6px; border-top:1px solid rgba(255,255,255,.1); padding-top:8px; display:flex; flex-direction:column; gap:8px; }
.spotify-picks-header{ display:flex; justify-content:space-between; align-items:center; font-size:.75rem; font-weight:600; }
.spotify-picks-header a{ color:var(--accent); font-weight:400; }
.spotify-empty{ font-size:.72rem; color:#a99a82; }
.spotify-card{ background:rgba(255,255,255,.05); border-radius:8px; padding:6px; }
.spotify-card-title{ font-size:.72rem; margin-bottom:4px; }
.spotify-note{ opacity:.6; font-style:italic; }
.remove-btn{ font-size:.68rem; color:#ff9d8a; margin-top:4px; }

/* ============================
   QUEUE DRAWER
   ============================ */
.queue-drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:25;
  width:320px; max-width:88vw;
  background:rgba(18,14,10,.97);
  border-left:1px solid rgba(255,255,255,.1);
  transform:translateX(0);
  transition:transform .3s ease;
  display:flex; flex-direction:column;
}
.queue-drawer.hidden{ transform:translateX(100%); }
.queue-header{ display:flex; justify-content:space-between; align-items:center; padding:14px; border-bottom:1px solid rgba(255,255,255,.08); font-weight:600; }
.queue-header small{ display:block; font-weight:400; opacity:.6; font-size:.68rem; }
#queueList{ list-style:none; overflow-y:auto; padding:8px; flex:1; }
#queueList li{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; font-size:.8rem; }
#queueList li:hover{ background:rgba(255,255,255,.05); }
#queueList img{ width:56px; height:32px; object-fit:cover; border-radius:4px; flex:0 0 auto; }
.queue-empty{ opacity:.6; font-size:.78rem; padding:12px; }

/* ============================
   PLAYER (two skins toggled via [data-skin] — classic pill + vintage radio)
   Both skins stay in the DOM together, bound to the same playback controls (matched by
   .js-* class, not id — see PLAYER ENGINE script) so switching skins never touches
   playback state. Visibility is a manual toggle only (#playerToggle) — no auto-hide,
   unlike the tab bar. Playback is unaffected either way; hiding is purely visual.
   ============================ */
.player{
  position:fixed; left:50%; bottom:24px; z-index:21;
  transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:transform .3s ease, opacity .3s ease;
}
.player.player-hidden{
  transform:translateX(-50%) translateY(140%);
  opacity:0;
  pointer-events:none;
}
.player[data-skin="pill"] .skin-radio{ display:none; }
.player[data-skin="radio"] .skin-pill{ display:none; }

.player-skin-toggle{
  font-size:.68rem; color:rgba(255,255,255,.6);
  text-decoration:underline; text-underline-offset:2px;
  background:none; border:none; padding:2px 4px; cursor:pointer;
}
.player-skin-toggle:hover{ color:#fff; }

/* shared between both skins' captions — values happen to match, no need to duplicate */
.np-title{ font-size:.82rem; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.np-artist{ font-size:.68rem; color:rgba(255,255,255,.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.np-time{ font-size:.62rem; color:rgba(255,255,255,.5); }

/* ---- classic pill skin (compact floating pill) ---- */
.skin-pill{
  display:flex; align-items:center; gap:12px;
  width:min(430px, calc(100vw - 48px));
  padding:10px 16px 10px 10px;
  border-radius:40px;
  background:rgba(18,14,10,.62);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.np-thumb{
  width:44px; height:44px; border-radius:12px; overflow:hidden; flex:0 0 auto;
  background:rgba(255,255,255,.08);
}
.np-thumb img{ width:100%; height:100%; object-fit:cover; }
.np-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
.np-progress-row{ margin-top:2px; }
.skin-pill .js-seek{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%; height:3px; border-radius:2px;
  background:rgba(255,255,255,.25);
  outline:none; cursor:pointer;
}
.skin-pill .js-seek::-webkit-slider-thumb{ -webkit-appearance:none; width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 4px rgba(0,0,0,.4); }
.skin-pill .js-seek::-moz-range-thumb{ width:9px; height:9px; border-radius:50%; background:#fff; border:none; }
.skin-pill .js-seek::-moz-range-track{ height:3px; border-radius:2px; background:rgba(255,255,255,.25); }
.np-transport{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
.np-transport button{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:.8rem; color:#fff; opacity:.85; }
.np-transport button:hover{ opacity:1; }
.skin-pill .js-play{
  width:34px; height:34px; border-radius:50%;
  background:#fff; color:#241a10; font-size:.85rem;
}

/* ---- vintage radio skin ---- */
.radio-frame{
  position:relative;
  width:min(380px, calc(100vw - 32px));
  aspect-ratio:900/507;
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.5));
}
.radio-img{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; user-select:none; -webkit-user-drag:none;
}
/* transparent hit areas layered over the artwork — sized to a min. 44px touch target
   via max(), independent of the (smaller) visible knob graphic underneath */
.radio-hit{
  position:absolute; z-index:2;
  border:none; background:transparent; border-radius:50%; padding:0; cursor:pointer;
  transform:translate(-50%,-50%);
  transition:background .2s ease, box-shadow .2s ease, transform .35s ease;
  font-size:0; line-height:0; color:transparent;
}
.radio-hit:hover, .radio-hit:focus-visible{
  background:radial-gradient(circle, rgba(255,225,160,.45), transparent 68%);
  box-shadow:0 0 18px 4px rgba(255,190,110,.55);
  outline:none;
}
/* play/pause — the TUNING knob (right). Rotates a little further "into the turn" while playing. */
.radio-hit-tuning{
  left:81.5%; top:76%; width:max(44px, 14%); aspect-ratio:1;
  transform:translate(-50%,-50%) rotate(0deg);
}
.radio-hit-tuning.is-playing{ transform:translate(-50%,-50%) rotate(32deg); }
/* mute — the VOLUME knob (left). Rotates toward OFF/MAX to match the printed dial labels. */
.radio-hit-volume{
  left:64%; top:76.5%; width:max(44px, 10%); aspect-ratio:1;
  transform:translate(-50%,-50%) rotate(20deg);
}
.radio-hit-volume.is-muted{ transform:translate(-50%,-50%) rotate(-45deg); }
/* next/prev — no natural control on the artwork for these, so they're tucked as tiny stacked
   tick buttons in the sliver of blank panel between the grille and the dial/volume knob (pixel-
   sampled: roughly x 490-536 of 900, clear of both the dial's bottom edge and the VOLUME text) */
.radio-transport-btn{
  position:absolute; z-index:2;
  width:44px; height:44px;
  transform:translate(-50%,-50%);
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; cursor:pointer;
}
.radio-transport-btn span{
  display:inline-flex; align-items:center; justify-content:center;
  width:15px; height:15px; border-radius:3px; font-size:8px; line-height:1; color:#e8d9b8;
  background:rgba(20,15,10,.55); border:1px solid rgba(230,210,170,.5);
  transition:background .2s ease, border-color .2s ease, transform .15s ease;
}
.radio-transport-btn:hover span, .radio-transport-btn:focus-visible span{ background:rgba(45,32,18,.8); border-color:#e8d9b8; outline:none; }
.radio-transport-btn:active span{ transform:scale(.9); }
.radio-frame .js-prev{ left:56%; top:64%; }
.radio-frame .js-next{ left:56%; top:82%; }
/* progress needle over the dial display — the existing .js-seek range input still does the
   real seeking (dragged/clicked), just made invisible and stretched over the dial's number
   band; this orange line is a pure visual readout of its value */
.radio-dial-track{ position:absolute; left:55%; right:6%; top:35%; bottom:41%; }
.radio-needle{
  position:absolute; top:0; bottom:0; left:0%; width:2px; margin-left:-1px;
  background:#ff7a33; box-shadow:0 0 4px rgba(255,122,51,.8);
  transition:left .4s linear;
  pointer-events:none;
}
.radio-dial-track .js-seek{
  position:absolute; inset:0; width:100%; height:100%; margin:0;
  -webkit-appearance:none; appearance:none;
  background:transparent; opacity:0; cursor:pointer;
}
.radio-caption{ max-width:min(380px, calc(100vw - 32px)); text-align:center; }
.np-meta{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:2px; }

@media (max-width:640px){
  .player{ bottom:12px; }
  .player[data-skin="pill"]{ left:12px; right:12px; width:auto; transform:none; }
  .player[data-skin="pill"].player-hidden{ transform:translateY(140%); }
  .skin-pill{ align-self:stretch; width:auto; padding:8px 12px 8px 8px; gap:8px; }
  .np-thumb{ width:36px; height:36px; border-radius:10px; }
  .radio-frame{ width:calc(100vw - 24px); }
  .np-title{ font-size:.76rem; }
  .np-artist{ font-size:.62rem; }
  .add-panel{ right:8px; left:8px; width:auto; bottom:130px; }
  .queue-drawer{ width:100%; max-width:100%; }
}
</style>
</head>
<body>

<!-- TODO: verify Hindi copy throughout this page (tab labels, loading states, queue header, error/empty text) -->

<div class="top-left" id="clockEl">--:-- --</div>

<div class="top-center">
  <span class="pulse-dot"></span>
  <span id="vibingCount">— online</span>
</div>

<div class="top-right">
  <button id="tabToggle" class="icon-btn" aria-label="Toggle scene menu">▴</button>
  <button id="playerToggle" class="icon-btn" aria-label="Toggle player">▾</button>
  <button id="queueToggle" class="icon-btn" aria-label="Toggle queue">☰</button>
  <button id="soundToggle" class="icon-btn" aria-label="Toggle transition sound">🔈</button>
  <a id="spotifyLink" class="pill-link" href="#" target="_blank" rel="noopener"><span class="pill-dot" style="background:#1db954"></span>Spotify<span class="ext-arrow">↗</span></a>
  <a id="ytMusicLink" class="pill-link" href="#" target="_blank" rel="noopener"><span class="pill-dot" style="background:#ff0000"></span>YT Music<span class="ext-arrow">↗</span></a>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ============================
// SITE CONFIG — edit these to update playlists
// ============================
const CONFIG = {
  // The PRIMARY queue that actually plays — an explicit list of YouTube video IDs,
  // loaded and walked in order. Get an ID from the video URL: youtube.com/watch?v=THIS_PART
  DEFAULT_VIDEO_IDS: [
    "uIYFObB-yv0",
    "1VdMEriTiDk",
    "665bcdJ2hQs",
    "xp5j2IHyTgs",
    "9nx09wvQvNE",
    "PWyXe6fzsmM",
    // add more video IDs here as songs are added
  ],

  // Used only if DEFAULT_VIDEO_IDS is empty — a last-resort video to play
  FALLBACK_VIDEO_IDS: [],

  // Spotify playlist URL — SECONDARY, shown as "Also on Spotify" link/panel.
  // Full playback requires visitor to log into Spotify inside the embed.
  SPOTIFY_PLAYLIST_URL: "https://open.spotify.com/playlist/57NwRU3l6nTtuLk4b8l1qk",

  // Site display name, tagline, etc. can also live here for easy editing
  SITE_NAME: "Yaadon Ka Radio",
  TAGLINE: "the sound of everyday India, 90s/2000s",
};

// ============================
// PLAYLIST STORAGE (localStorage, per-browser, no login/backend)
// ============================
const STORAGE_KEY = 'yaadonRadio.addedPlaylists.v1';

function loadStored(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { youtube: [], spotify: [] };
    const parsed = JSON.parse(raw);
    return {
      youtube: Array.isArray(parsed.youtube) ? parsed.youtube : [],
      spotify: Array.isArray(parsed.spotify) ? parsed.spotify : [],
    };
  }catch(e){ return { youtube: [], spotify: [] }; }
}
function saveStored(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stored)); }catch(e){ /* storage full/blocked: ignore, nothing critical lost */ }
}
let stored = loadStored();

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================
// SCENES — tab switching + crossfade
// ============================
const sceneButtons = document.querySelectorAll('.tab-btn');
sceneButtons.forEach(btn => btn.addEventListener('click', () => setScene(btn.dataset.scene)));

function setScene(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('active', s.dataset.scene === id));
  sceneButtons.forEach(b => b.classList.toggle('active', b.dataset.scene === id));
  document.documentElement.setAttribute('data-scene', id);
  playTransitionSound();
}

// tab bar: auto-hides after a few seconds idle, any interaction brings it back
const tabbarEl = document.querySelector('.tabbar');
const tabToggleBtn = document.getElementById('tabToggle');
let tabHideTimer;
function hideTabbar(){
  tabbarEl.classList.add('tabbar-hidden');
  tabToggleBtn.textContent = '▾';
}
function showTabbar(){
  tabbarEl.classList.remove('tabbar-hidden');
  tabToggleBtn.textContent = '▴';
  clearTimeout(tabHideTimer);
  tabHideTimer = setTimeout(hideTabbar, 4500);
}
// interactions originating on the toggle button itself are excluded, otherwise a tap/click
// would show-then-immediately-re-hide (touchstart fires before click) — see toggle handler below
['mousemove', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
  document.addEventListener(evt, (e) => { if(!tabToggleBtn.contains(e.target)) showTabbar(); }, { passive: true });
});
tabToggleBtn.addEventListener('click', () => {
  if(tabbarEl.classList.contains('tabbar-hidden')) showTabbar();
  else { clearTimeout(tabHideTimer); hideTabbar(); }
});
showTabbar();

// player: manual show/hide only — no auto-hide timer. Hiding is purely visual,
// playback (and the toggle button itself) is unaffected either way.
const playerEl = document.getElementById('player');
const playerToggleBtn = document.getElementById('playerToggle');
playerToggleBtn.addEventListener('click', () => {
  const hidden = playerEl.classList.toggle('player-hidden');
  playerToggleBtn.textContent = hidden ? '▴' : '▾';
});

// player skin: classic pill (default) vs vintage radio — a pure visual swap, both skins
// stay bound to the same playback controls (see PLAYER ENGINE section). Choice persists
// across visits via localStorage.
const SKIN_STORAGE_KEY = 'yaadonRadio.playerSkin.v1';
const skinToggleBtn = document.getElementById('skinToggle');
function applySkin(skin){
  playerEl.dataset.skin = skin;
  skinToggleBtn.textContent = skin === 'radio' ? 'Switch to classic player' : 'Switch to radio view';
}
let currentSkin = localStorage.getItem(SKIN_STORAGE_KEY) === 'radio' ? 'radio' : 'pill';
applySkin(currentSkin);
skinToggleBtn.addEventListener('click', () => {
  currentSkin = currentSkin === 'radio' ? 'pill' : 'radio';
  applySkin(currentSkin);
  try{ localStorage.setItem(SKIN_STORAGE_KEY, currentSkin); }catch(e){ /* storage full/blocked: skin just won't persist */ }
});

// optional muted-by-default transition blip, synthesized (no audio file needed)
let soundEnabled = false;
let actx;
const soundToggle = document.getElementById('soundToggle');
soundToggle.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundToggle.textContent = soundEnabled ? '🔊' : '🔈';
});
function playTransitionSound(){
  if(!soundEnabled) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine'; o.frequency.value = 520;
    g.gain.setValueAtTime(0.001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.08, actx.currentTime + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.3);
  }catch(e){ /* Web Audio unavailable: silently skip, sound is a nice-to-have */ }
}

// ============================
// TOP OVERLAY (clock, external links — clock/online counter/tab-toggle live in the SCENES section above)
// ============================
const clockEl = document.getElementById('clockEl');
function updateClock(){
  const d = new Date();
  let h = d.getHours() % 12; if(h === 0) h = 12;
  const m = String(d.getMinutes()).padStart(2, '0');
  const ampm = d.getHours() < 12 ? 'am' : 'pm';
  clockEl.textContent = `${h}:${m} ${ampm}`;
}
updateClock();
setInterval(updateClock, 30000);

const spotifyLinkEl = document.getElementById('spotifyLink');
const ytMusicLinkEl = document.getElementById('ytMusicLink');
spotifyLinkEl.href = CONFIG.SPOTIFY_PLAYLIST_URL;
if(CONFIG.DEFAULT_VIDEO_IDS.length){
  ytMusicLinkEl.href = `https://music.youtube.com/watch?v=${CONFIG.DEFAULT_VIDEO_IDS[0]}`;
}

// ============================
// PLAYER ENGINE (hidden YouTube IFrame API, custom UI)
// ============================
// both player skins stay in the DOM together; controls are matched pairs (one per skin)
// selected by class and driven in lockstep so switching skins never touches playback state
const trackTitleEls = document.querySelectorAll('.js-title');
const trackArtistEls = document.querySelectorAll('.js-artist');
const trackThumbEls = document.querySelectorAll('.js-thumb');
const elapsedEls = document.querySelectorAll('.js-elapsed');
const durationEls = document.querySelectorAll('.js-duration');
const seekBars = document.querySelectorAll('.js-seek');
const playBtns = document.querySelectorAll('.js-play');
const muteBtns = document.querySelectorAll('.js-mute');
const prevBtns = document.querySelectorAll('.js-prev');
const nextBtns = document.querySelectorAll('.js-next');
const radioNeedle = document.getElementById('radioNeedle');
function setText(els, text){ els.forEach(el => el.textContent = text); }
function setNeedle(pct){ radioNeedle.style.left = pct + '%'; }
const vibingCountEl = document.getElementById('vibingCount');
const queueToggleBtn = document.getElementById('queueToggle');
const queueDrawer = document.getElementById('queueDrawer');
const queueCloseBtn = document.getElementById('queueClose');
const queueListEl = document.getElementById('queueList');

let player = null;
let apiReady = false;
let isPlaying = false;
let isMuted = false;
let seeking = false;
let lastVideoId = null;
let fallbackIndex = 0;

// single flat queue, walked by index: CONFIG.DEFAULT_VIDEO_IDS first, then anything the
// visitor adds via the Add-your-playlist panel. A user-added entry can be a whole playlist
// (kind:'playlist') as well as a single video — everything else just walks by index.
let queue = CONFIG.DEFAULT_VIDEO_IDS.map(id => ({ kind: 'video', id })).concat(stored.youtube);
let queueIndex = -1;

window.onYouTubeIframeAPIReady = function(){
  apiReady = true;
  createPlayer();
};
setTimeout(() => {
  if(!apiReady){
    setText(trackTitleEls, "Couldn't load the tape deck — check your connection 📼");
    setText(trackArtistEls, '');
  }
}, 7000);

function createPlayer(){
  const vars = { controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1 };
  if(queue.length){
    queueIndex = 0;
    const first = queue[0];
    if(first.kind === 'playlist') { vars.listType = 'playlist'; vars.list = first.id; }
    else vars.videoId = first.id;
  } else if(CONFIG.FALLBACK_VIDEO_IDS.length){
    vars.videoId = CONFIG.FALLBACK_VIDEO_IDS[0];
  } else {
    setText(trackTitleEls, 'No playlist configured yet — set CONFIG.DEFAULT_VIDEO_IDS');
    setText(trackArtistEls, '');
    return;
  }
  player = new YT.Player('ytPlayerHidden', {
    height: '0', width: '0', playerVars: vars,
    events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange, onError: onPlayerError },
  });
}

function onPlayerReady(){
  tickVibing();
}
// YouTube IFrame API error codes: see https://developers.google.com/youtube/iframe_api_reference#onError
const PLAYER_ERROR_REASONS = {
  2: 'invalid video ID',
  5: "can't play in this browser",
  100: 'video not found or removed',
  101: 'embedding disabled by the uploader',
  150: 'embedding disabled by the uploader',
};
function onPlayerError(e){
  const code = e && e.data;
  const reason = PLAYER_ERROR_REASONS[code] || `unknown error ${code}`;
  const failedItem = queue[queueIndex];
  console.error(`[player] track failed to load (${reason}) — skipping`, failedItem);
  if(queue.length){
    // a specific track in the queue is unavailable (deleted/private/restricted) — skip it,
    // but say so on screen first instead of silently jumping to the next track
    setText(trackTitleEls, `⚠ Can't play this track (${reason}) — skipping…`);
    setText(trackArtistEls, '—');
    setTimeout(advanceQueue, 1400);
  } else if(CONFIG.FALLBACK_VIDEO_IDS.length > fallbackIndex + 1){
    fallbackIndex++;
    player.loadVideoById(CONFIG.FALLBACK_VIDEO_IDS[fallbackIndex]);
  } else {
    setText(trackTitleEls, 'This tape got stuck — try refreshing 📼');
  }
}
function updatePlayUI(){
  playBtns.forEach(btn => {
    btn.textContent = isPlaying ? '⏸' : '▶';
    btn.classList.toggle('is-playing', isPlaying);
    btn.setAttribute('aria-pressed', String(isPlaying));
  });
}
function updateMuteUI(){
  muteBtns.forEach(btn => {
    btn.textContent = isMuted ? '🔇' : '🔊';
    btn.classList.toggle('is-muted', isMuted);
    btn.setAttribute('aria-pressed', String(isMuted));
  });
}
function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){ isPlaying = true; updatePlayUI(); updateNowPlaying(); }
  else if(e.data === YT.PlayerState.PAUSED){ isPlaying = false; updatePlayUI(); }
  else if(e.data === YT.PlayerState.CUED){ updateNowPlaying(); }
  else if(e.data === YT.PlayerState.ENDED){ advanceQueue(); }
}

function loadQueueItem(i){
  const item = queue[i];
  if(!item) return;
  if(item.kind === 'playlist') player.loadPlaylist({ list: item.id });
  else player.loadVideoById(item.id);
  renderQueue();
}

// ponytail: queue is a flat array walked by index, wrapping at the ends — add shuffle/history if requested
function advanceQueue(){
  if(!queue.length) return;
  queueIndex = (queueIndex + 1) % queue.length;
  loadQueueItem(queueIndex);
}

function nextTrack(){
  if(!player) return;
  advanceQueue();
}
function prevTrack(){
  if(!player || !queue.length) return;
  queueIndex = (queueIndex - 1 + queue.length) % queue.length;
  loadQueueItem(queueIndex);
}
function togglePlayPause(){
  if(!player) return;
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}
function toggleMute(){
  if(!player) return;
  isMuted = !isMuted;
  if(isMuted) player.mute(); else player.unMute();
  updateMuteUI();
}

playBtns.forEach(btn => btn.addEventListener('click', togglePlayPause));
nextBtns.forEach(btn => btn.addEventListener('click', nextTrack));
prevBtns.forEach(btn => btn.addEventListener('click', prevTrack));
muteBtns.forEach(btn => btn.addEventListener('click', toggleMute));

function fmtTime(s){
  s = Math.max(0, Math.floor(s || 0));
  const m = Math.floor(s / 60);
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}
setInterval(() => {
  if(!player || !isPlaying || typeof player.getCurrentTime !== 'function') return;
  const cur = player.getCurrentTime() || 0;
  const dur = player.getDuration() || 0;
  setText(elapsedEls, fmtTime(cur));
  setText(durationEls, fmtTime(dur));
  if(dur > 0 && !seeking){
    const pct = (cur / dur) * 100;
    seekBars.forEach(bar => { bar.value = pct; });
    setNeedle(pct);
  }
}, 500);

seekBars.forEach(bar => {
  bar.addEventListener('input', () => {
    seeking = true;
    seekBars.forEach(b => { if(b !== bar) b.value = bar.value; });
    setNeedle(bar.value);
  });
  bar.addEventListener('change', () => {
    if(player && typeof player.getDuration === 'function'){
      const dur = player.getDuration() || 0;
      player.seekTo((bar.value / 100) * dur, true);
    }
    seeking = false;
  });
});

function fetchOembed(id){
  return fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}&format=json`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .catch(() => null);
}

function updateNowPlaying(){
  if(!player) return;
  let id;
  try{ id = player.getVideoData().video_id; }catch(e){ id = null; }
  if(!id || id === lastVideoId) return;
  lastVideoId = id;
  setText(trackTitleEls, 'Loading the cassette…'); // TODO: verify Hindi copy — कैसेट लोड हो रहा है…
  setText(trackArtistEls, '—');
  trackThumbEls.forEach(el => { el.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`; el.style.display = 'block'; });
  fetchOembed(id).then(d => {
    if(!d || id !== lastVideoId) return;
    setText(trackTitleEls, d.title || 'Unknown Track');
    setText(trackArtistEls, d.author_name || '—');
  });
  renderQueue();
}

// "X people online right now" — cosmetic-only fake counter, no backend
let vibingCount = 12 + Math.floor(Math.random() * 40);
function tickVibing(){
  vibingCount = Math.max(6, Math.min(180, vibingCount + Math.floor(Math.random() * 5) - 2));
  vibingCountEl.textContent = `${vibingCount} online`;
  setTimeout(tickVibing, 10000 + Math.random() * 10000);
}

function toggleQueue(){
  queueDrawer.classList.toggle('hidden');
  if(!queueDrawer.classList.contains('hidden')) renderQueue();
}
queueToggleBtn.addEventListener('click', toggleQueue);
queueCloseBtn.addEventListener('click', toggleQueue);

function renderQueue(){
  queueListEl.innerHTML = '';
  const items = queue.slice(queueIndex + 1)
    .filter(q => q.kind === 'video')
    .map(q => ({ id: q.id, title: q.title || null }));
  if(!items.length){
    queueListEl.innerHTML = '<li class="queue-empty">Queue is empty for now — add a track below.</li>';
    return;
  }
  items.forEach(it => {
    const li = document.createElement('li');
    li.innerHTML = `<img src="https://img.youtube.com/vi/${it.id}/mqdefault.jpg" alt=""><span>${it.title ? escapeHtml(it.title) : 'Track'}</span>`;
    queueListEl.appendChild(li);
    if(!it.title){
      fetchOembed(it.id).then(d => { if(d) li.querySelector('span').textContent = d.title; });
    }
  });
}

// keyboard shortcuts: Space play/pause, ←/→ seek, N/P next/prev, Q toggle queue
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(!player) return;
  switch(e.code){
    case 'Space': e.preventDefault(); togglePlayPause(); break;
    case 'ArrowRight': player.seekTo((player.getCurrentTime() || 0) + 5, true); break;
    case 'ArrowLeft': player.seekTo(Math.max(0, (player.getCurrentTime() || 0) - 5), true); break;
    case 'KeyN': nextTrack(); break;
    case 'KeyP': prevTrack(); break;
    case 'KeyQ': toggleQueue(); break;
  }
});

// ============================
// USER ADD-PLAYLIST (YouTube → queue, Spotify → oEmbed panel)
// ============================
const addPanel = document.getElementById('addPanel');
const addToggleBtn = document.getElementById('addToggle');
const linkInput = document.getElementById('linkInput');
const titleInput = document.getElementById('titleInput');
const addSubmitBtn = document.getElementById('addSubmit');
const addError = document.getElementById('addError');
const spotifyPicksEl = document.getElementById('spotifyPicks');

addToggleBtn.addEventListener('click', () => addPanel.classList.toggle('collapsed'));

function parseYouTube(url){
  try{
    const u = new URL(url);
    if(u.hostname !== 'youtu.be' && !/(^|\.)youtube\.com$/.test(u.hostname)) return null;
    const list = u.searchParams.get('list');
    if(list) return { kind: 'playlist', id: list };
    let vid = u.searchParams.get('v');
    if(!vid && u.hostname === 'youtu.be') vid = u.pathname.slice(1);
    if(!vid){
      const m = u.pathname.match(/\/(embed|shorts)\/([a-zA-Z0-9_-]{11})/);
      if(m) vid = m[2];
    }
    if(vid && /^[a-zA-Z0-9_-]{11}$/.test(vid)) return { kind: 'video', id: vid };
    return null;
  }catch(e){ return null; }
}
function parseSpotify(url){
  try{
    const u = new URL(url);
    if(u.hostname !== 'open.spotify.com') return null;
    const m = u.pathname.match(/\/(track|playlist|album)\/([a-zA-Z0-9]+)/);
    return m ? { kind: m[1], id: m[2] } : null;
  }catch(e){ return null; }
}

function flashAdded(){
  addError.textContent = 'Added! 🎶';
  addError.classList.add('success');
  setTimeout(() => { addError.textContent = ''; addError.classList.remove('success'); }, 2500);
}

addSubmitBtn.addEventListener('click', () => {
  const url = linkInput.value.trim();
  const customTitle = titleInput.value.trim();
  addError.classList.remove('success');
  addError.textContent = '';
  if(!url) return;

  const yt = parseYouTube(url);
  if(yt){
    const item = { kind: yt.kind, id: yt.id, title: customTitle || 'Your mix' };
    stored.youtube.push(item);
    saveStored();
    queue.push(item);
    renderQueue();
    flashAdded();
    linkInput.value = ''; titleInput.value = '';
    return;
  }
  const sp = parseSpotify(url);
  if(sp){
    stored.spotify.push({ kind: sp.kind, id: sp.id, title: customTitle || 'Spotify pick' });
    saveStored();
    renderSpotifyPicks();
    flashAdded();
    linkInput.value = ''; titleInput.value = '';
    return;
  }
  addError.textContent = "That doesn't look like a YouTube or Spotify link — try again? / फिर से कोशिश करें"; // TODO: verify Hindi copy
});

function renderSpotifyPicks(){
  spotifyPicksEl.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'spotify-picks-header';
  header.innerHTML = `<span>Spotify Picks</span><a href="${escapeHtml(CONFIG.SPOTIFY_PLAYLIST_URL)}" target="_blank" rel="noopener">Also on Spotify →</a>`;
  spotifyPicksEl.appendChild(header);

  if(!stored.spotify.length){
    const p = document.createElement('p');
    p.className = 'spotify-empty';
    p.textContent = 'No Spotify adds yet — paste a link above. (opens with Spotify)';
    spotifyPicksEl.appendChild(p);
    return;
  }
  stored.spotify.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'spotify-card';
    card.innerHTML = `
      <div class="spotify-card-title">${escapeHtml(item.title)} <span class="spotify-note">opens with Spotify</span></div>
      <iframe src="https://open.spotify.com/embed/${item.kind}/${item.id}" width="100%" height="80" frameborder="0" allow="encrypted-media" loading="lazy"></iframe>
      <button class="remove-btn" data-i="${i}">Remove</button>
    `;
    spotifyPicksEl.appendChild(card);
  });
  spotifyPicksEl.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      stored.spotify.splice(+btn.dataset.i, 1);
      saveStored();
      renderSpotifyPicks();
    });
  });
}

// ---- init ----
renderSpotifyPicks();
renderQueue();
</script>
